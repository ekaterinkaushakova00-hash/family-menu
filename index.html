:root{--bg:#f6f3ec;--card:#fffdf9;--line:#e6e1d6;--text:#25382f;--muted:#6b766d;--green:#3b5e47;--green2:#e9efe6;--blue:#376b86;--red:#a34d32;--r:20px}
body{margin:0 auto;max-width:900px;padding:0 clamp(12px,3vw,28px) 60px;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:none}
h1,h2,h3,p{margin:0 0 10px}
h2{font-size:clamp(24px,4vw,32px);font-weight:700;letter-spacing:-.01em;margin:6px 0 8px}
h3{font-size:19px;font-weight:700}
small,.muted{color:var(--muted);font-size:13.5px}
nav{position:sticky;top:0;z-index:5;display:flex;gap:4px;overflow-x:auto;background:rgba(246,243,236,.94);backdrop-filter:blur(8px);margin:0 calc(-1*clamp(12px,3vw,28px)) 22px;padding:14px clamp(12px,3vw,28px) 10px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav::before{content:"Семейное меню";font:700 17px/40px system-ui;margin-right:auto;padding-right:14px;white-space:nowrap;color:var(--green)}
nav button{flex:none;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:8px 15px;min-height:40px;font-size:15px}
nav button.on{background:var(--green);color:#fff}
button,select,input,textarea{font:inherit;color:inherit;max-width:100%;min-height:44px;border:1px solid #d7d9cf;background:#fff;border-radius:12px;padding:9px 12px}
button{cursor:pointer;background:var(--green2);border-color:transparent;color:var(--green);font-weight:600;transition:background .15s}
button:hover{background:#dfe8dc}
.main{background:var(--green);color:#fff;padding:12px 26px;border-radius:14px;font-size:16px;box-shadow:0 6px 16px -8px rgba(59,94,71,.7)}
.main:hover{background:#30503b}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #8bb09a;outline-offset:2px}
section,article,details{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(14px,3vw,22px);margin:12px 0;box-shadow:0 1px 2px rgba(40,50,40,.04)}
details details{background:#faf8f2;box-shadow:none;margin:10px 0;border-radius:14px}
summary{cursor:pointer;font-weight:650}
label{display:block;margin:6px 0;font-size:13px;color:var(--muted)}
label>input:not([type=checkbox]),label>select,label>textarea{display:block;width:100%;margin-top:4px;color:var(--text);font-size:16px}
input[type=checkbox]{min-height:auto;width:20px;height:20px;accent-color:var(--green);vertical-align:-4px;margin-right:6px}
ul{padding-left:20px;margin:8px 0}
li{margin:3px 0}
textarea{min-height:90px;width:100%}
.warn{color:#8a5a1e}
.crumb{display:block;font-size:13px;letter-spacing:.08em;color:var(--muted)}
.daytitle{font-size:clamp(32px,6vw,46px);font-weight:750;letter-spacing:-.02em;margin:4px 0 18px}
.daily{background:#fff;border-radius:24px;padding:clamp(16px,3.4vw,28px);border-color:#dcdcd2}
.daily h3{font-size:clamp(20px,3.6vw,26px);margin:0 0 14px}
.kb{width:100%;border-collapse:collapse;table-layout:fixed;text-align:center;font-variant-numeric:tabular-nums}
.kb th,.kb td{border:0;padding:6px 0}
.kb tr:first-child th{font-size:clamp(11px,2vw,15px);font-weight:400;color:var(--muted)}
.kb th:first-child{text-align:left;width:18%}
.kb tr:not(:first-child) th{font-size:clamp(17px,3.4vw,24px);font-weight:700}
.kb button{background:none;border:0;box-shadow:none;padding:2px 0;min-height:40px;font-size:clamp(18px,3.8vw,28px);font-weight:750;color:var(--text);width:100%}
.kb tr:last-child>*{border-top:1px solid #e7e8e2}
.kb .lo{color:var(--blue)}.kb .hi{color:var(--red)}
#hint{display:block;margin-top:10px;min-height:1em}
#hint:empty{display:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:20px 0 26px}
.days{display:flex;gap:3px;background:#ebe8de;padding:4px;border-radius:15px}
.days button{background:transparent;color:var(--muted);min-height:38px;padding:6px 11px;border-radius:11px;font-weight:600}
.days button.on{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.sectitle{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.sectitle h2{font-size:22px;margin:0}
article{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;padding-top:16px}
article>h3{margin:0;font-size:20px}
article>label:first-of-type{margin:0;background:var(--green2);color:var(--green);padding:6px 12px;border-radius:999px;font-weight:600;font-size:13.5px;cursor:pointer}
article>.line,article>p,article>small,article>b,article>br{grid-column:1/-1}
article>p{margin:12px 0 0}
article>p button{background:transparent;border:1.5px dashed #b8c7ba;width:100%}
.line{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(80px,1fr) minmax(80px,1fr) auto;gap:10px;align-items:end;border-top:1px solid #efece4;margin-top:12px;padding-top:12px}
.line label{margin:0}
.line>button{background:transparent;color:#9a6a58;font-weight:500;padding:9px 10px}
.line>button:hover{background:#f6ebe5}
section>p{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0;padding:10px 0;border-top:1px solid #efece4}
section>p:first-of-type{border-top:0}
section>p>button{background:transparent;padding:4px 0;min-height:36px;color:var(--text);text-align:left}
section>p>button:hover{background:none;text-decoration:underline}
section>h3{margin-bottom:8px}
@media(max-width:600px){nav::before{display:none}nav{flex-wrap:wrap;gap:4px;padding-top:10px}nav button{flex:1 1 auto;padding:7px 10px;font-size:14px;min-height:38px}.line{grid-template-columns:1fr 1fr auto}.food{grid-column:1/-1}.bar{flex-direction:column;align-items:stretch}.days button{flex:1;padding:6px 0}.main{width:100%}.kb th:first-child{width:15%}}

о.\n\nИсточник: Книга рецептов · 1, стр. 7. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K1-008": {"name": "Живое варенье", "group": "Другое", "lines": [["c_чиа", 15], ["c_ягоды", 500.0], ["c_финики", 20]], "method": "Смешиваем все ингредиенты в блендере, Дать постоять 15 минут.\n\nИсточник: Книга рецептов · 1, стр. 8. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": false}, "K1-009": {"name": "Запеканка классическая", "group": "Завтрак", "lines": [["c_творог5", 150], ["c_кефир", 30.0], ["egg", 100.0]], "method": "Взбиваем яйца, добавляем творог и кефир {2-3 стложки), Добавляем сахорозаменитель (Стевию). Выкладываем полученную массу в форму для запекания, на пергамент. Ставим в духовку и запекаем в течении 40 минут при температуре 200 градусов.\n\nИсточник: Книга рецептов · 1, стр. 9. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: стевия.", "y": null, "fresh": false, "auto": true}, "K1-010": {"name": "Запеканка с изюмом", "group": "Завтрак", "lines": [["c_творог5", 150], ["c_кефир", 30.0], ["egg", 100.0], ["c_изюм", 20.0]], "method": "Взбиваем яйца, добавляем творог и кефир (2-5 ст.ложки), Добавляем сахорозаменитель и предварительно распаренный изюм. Выкладываем в смазанную маслом форму всю смесь. Поставить в духовку и запекать в течении50 минут.\n\nИсточник: Книга рецептов · 1, стр. 10. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: стевия.", "y": null, "fresh": false, "auto": true}, "K1-011": {"name": "Лаваш с сыром и помидорами", "group": "Завтрак", "lines": [["c_лаваш", 60], ["c_сыр", 30.0], ["tomato", 120.0], ["c_зелень", 10.0]], "method": "Натираем сыр, мелко режем помидор, зелень, все перемешиваем. Полученную смесь выкладываем на лаваш, скручиваем его в трубочку и обжариваем на антипригарной сковороде, до хрустящей корочки.\n\nИсточник: Книга рецептов · 1, стр. 11. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K1-012": {"name": "Лаваш с яйцом", "group": "Завтрак", "lines": [["c_лаваш", 60], ["egg", 50.0], ["c_сыр", 20.0], ["tomato", 60.0]], "method": "Порезанные кубиками помидоры опускаем на сковороду, предварительно смазанную маслом гхи. Заливаем разболтанным и подсоленным яйцом, сразу выкладываем лаваш. Ждем, пока яйцо приготовится, переворачиваем все вместе, выкладываем сыр, сворачиваем пополам и обжариваем лаваш до корочки.\n\nИсточник: Книга рецептов · 1, стр. 12. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K1-013": {"name": "Лаваш с шампиньонами", "group": "Завтрак", "lines": [["c_лаваш", 60], ["c_сыр", 40.0], ["tomato", 50.0], ["c_зелень", 10.0], ["c_грибы", 100.0]], "method": "Натираем сыр, мелко режем помидор, зелень. Обжариваем лук и шампиньоны 5-7 минут, добавляем помидорки. Выкладываем полученную смесь на лаваш‚сверху посыпаем сыром и зеленью‚заворачиваем в рулет. Обжариваем на сковороде с 2 сторон по 2 минуты.\n\nИсточник: Книга рецептов · 1, стр. 13. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: специи/соль.", "y": null, "fresh": false, "auto": true}, "K1-014": {"name": "Ленивая запеканка", "group": "Завтрак", "lines": [["c_лаваш", 60], ["c_шпинат", 40], ["tomato", 120], ["c_моцарелла", 50], ["egg", 100.0]], "method": "2 листика лаваша вымешиваем Закладываем в форму для запекания, сверху выкладываем шпинат, помидорки, моцареллу, разбиваем 2 яйца, перемешиваем, ставим запекать на 20 минут при температуре 180 градусов.\n\nИсточник: Книга рецептов · 1, стр. 14. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K1-015": {"name": "Ленивая овсянка", "group": "Завтрак", "lines": [["c_овсянка", 50.0], ["c_йогурт", 100.0], ["c_ягоды", 80]], "method": "Засыпаем в банку овсяные хлопья, заливаем их водой, перемешиваем. После заливаем йогуртом. Сверху выкладываем порезанные фрукт и ягоды. Не перемешивая, закрываем крышкой и на ночь ставим в холодильник\n\nИсточник: Книга рецептов · 1, стр. 15. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K1-016": {"name": "Овсяная каша", "group": "Завтрак", "lines": [["c_овсянка", 100.0], ["c_ягоды", 80], ["c_кокос-молоко", 70.0]], "method": "В кипящую воду мы засыпаем овсянку. варим 7-10 минут. Затем добавляем растительное молоко и варим еще1О минут на медленном огне. (В готовую кашу добавляем ягоды, орехи,льняное масло,хорошо перемешиваем)\n\nИсточник: Книга рецептов · 1, стр. 16. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K1-017": {"name": "Омлет со шпинатом", "group": "Завтрак", "lines": [["egg", 100.0], ["c_шпинат", 50.0], ["c_авокадо", 75.0], ["c_сыр", 50.0], ["tomato", 60.0]], "method": "Смешиваем в блендере 2 яйца и шпинат, выливаем на разогретую сковороду, обжариваем с одной стороны, переворачиваем, выкладываем начинку - порезанные кубиками авокадо и помидор, сверху посыпаем натертым сыром. закрываем, как блин, и оставляем под крышкой на 35 минуты\n\nИсточник: Книга рецептов · 1, стр. 17.", "y": null, "fresh": false, "auto": true}, "K1-018": {"name": "Овсянка с творогом", "group": "Завтрак", "lines": [["c_овсянка", 100.0], ["c_творог5", 100.0], ["c_мёд", 5.0], ["apple", 180.0]], "method": "Очищаем яблоко от кожуры и убираем сердцевину. Ставим яблоко в микроволновую печь на1 минута, чтобы стало мягким. Овсянку варим 5-10 минут и накрываем крышкой. Творог с медом взбить в блендере до однородной массы, добавить к готовой овсянке, перемешать. Сверху украсить запеченными дольками яблока.\n\nИсточник: Книга рецептов · 1, стр. 18.", "y": null, "fresh": false, "auto": true}, "K1-019": {"name": "Овсяноблин", "group": "Завтрак", "lines": [["oat", 40.0], ["egg", 100], ["milk", 40.0]], "method": "Смешиваем молоко с яйцом, можно добавить немного соли. После этого добавляем овсяную муку, смешиваем до однородной массы. На сковородку добавляем каплю масла. Разогреваем ее, выливаем полученную смесь. Обжариваем по 2 минуты с каждой стороны.\n\nИсточник: Книга рецептов · 1, стр. 19. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K1-020": {"name": "Омлет", "group": "Завтрак", "lines": [["egg", 100.0]], "method": "Взбиваем 2 яйца, выливаем на сковороду,‚как блин,ставим на медленный огонь на 7-10 минут.Накрыть крышкой.Можно добавить помидор и зелень.\n\nИсточник: Книга рецептов · 1, стр. 20. По вкусу: специи/соль.", "y": null, "fresh": false, "auto": true}, "K1-021": {"name": "Оладьи", "group": "Завтрак", "lines": [["oat", 100.0], ["c_ягоды", 20.0], ["c_шоколад-сироп", 15], ["egg", 100], ["banana", 120]], "method": "Ингредиенты с1-5 взбить в блендере, жарить на антипригарной сковороде, с двух сторон. Сверху полить шоколадным сиропом и украсить ягодами.\n\nИсточник: Книга рецептов · 1, стр. 21. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: разрыхлитель, специи/соль.", "y": null, "fresh": false, "auto": true}, "K1-022": {"name": "Рикоттники", "group": "Завтрак", "lines": [["c_рикотта", 500.0], ["c_мука-рис", 30.0], ["c_ягоды", 80]], "method": "Перемешиваем все ингредиенты, разливаем по формочкам, выпекаем в духовке 25 минут, при температуре 180 градусов.\n\nИсточник: Книга рецептов · 1, стр. 22. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K1-023": {"name": "Сырники на сковородке", "group": "Завтрак", "lines": [["c_творог-мягк", 250.0], ["egg", 50.0], ["c_мука-рис", 30.0]], "method": "Смешиваем творог с яйцом, рассыпаем рисовую муку на разделочной доске. скатываем комочек, выкладываем на муку. сверху ставим стакан и хорошо скатываем сырник. выкладываем на разогретую сковородку, обжариваем с 2 сторон до золотистой корочки\n\nИсточник: Книга рецептов · 1, стр. 23. По вкусу: стевия.", "y": null, "fresh": false, "auto": true}, "K1-024": {"name": "Сырники с маком", "group": "Завтрак", "lines": [["c_творог-мягк", 150], ["c_мак", 10], ["egg", 50.0], ["c_мука-рис", 20.0]], "method": "Смешиваем все ингредиенты до однородной массы, формируем небольшой колобок, ‚ формируем сырник с помощью стакана. Обжариваем на масле ГХИ, с 2 сторон\n\nИсточник: Книга рецептов · 1, стр. 24. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: стевия.", "y": null, "fresh": false, "auto": true}, "K1-025": {"name": "Сырники в духовке", "group": "Завтрак", "lines": [["c_творог5", 250.0], ["egg", 50.0], ["oat", 20.0], ["c_овсянка", 15.0]], "method": "Смешиваем - творог, яйцо, хлопья, муку и стевию. Все хорошо перемешиваем, формируем шарики и выкладываем на противень, предварительно застеленный пергаментной бумагой, ставим в духовку на 15 минут, при температуре 180 градусов.\n\nИсточник: Книга рецептов · 1, стр. 25. По вкусу: стевия.", "y": null, "fresh": false, "auto": true}, "K1-026": {"name": "Тост с авокадо", "group": "Завтрак", "lines": [["c_хлеб-бел", 30], ["c_авокадо", 75.0], ["c_творог5", 150], ["c_зелень", 10], ["oil", 4.6], ["c_семга", 50.0], ["c_маслины", 10.0]], "method": "Обжариваем хлеб с двух сторон, в отдельной посуде разминаем авокадо. добавляем творожный сыр, добавляем творог,мелко порезанную зелень,масло,мелко порезанную рыбу,и порезанные маслины.Все хорошо перемешиваем и выкладываем на хлеб.\n\nИсточник: Книга рецептов · 1, стр. 26. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K1-027": {"name": "Шоколадный блин с мягким творогом", "group": "Завтрак", "lines": [["oat", 25.0], ["egg", 50.0], ["c_кокос-молоко", 50.0], ["c_какао", 7.0], ["c_творог-мягк", 50.0], ["c_ягоды", 50.0]], "method": "1.Геркулес измельчить в кофемолке или блендере, если используете готовую муку, то можно пропустить этот шаг 2. К муке добавить какао, молоко и яйцо, перемешать, дать постоять тесту пару минут 5. Влить тесто на разогретую сковороду, обжарить с двух сторон по паре минут 4. На половину блинчика выложить творог и ягоды, закрыть второй половинкой,можно посыпать кокосовой стружкой\n\nИсточник: Книга рецептов · 1, стр. 27.", "y": null, "fresh": false, "auto": true}, "K1-028": {"name": "Яичный рулет", "group": "Завтрак", "lines": [["egg", 200.0], ["c_сыр", 30], ["c_зелень", 10]], "method": "Отделяем белки от желтков, все взбиваем, в белки добавляем порезанную зелень. На сковороду выливаем желтки, наверх выкладываем кусочки сыра и сворачиваем сразу в рулет. Рядом выливаем белки и снова заворачиваем. Желток с сыром получается внутри.\n\nИсточник: Книга рецептов · 1, стр. 28. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: специи/соль.", "y": null, "fresh": false, "auto": true}, "K1-029": {"name": "Яйца пашот", "group": "Другое", "lines": [["egg", 100.0]], "method": "Разбейте яйцо в небольшую миску, нагрейте воду и добавьте пару чайных ложек уксуса. Опускаете яйцо в воду и ждете, пока белок не начнет обволакивать желток. Далее достаете яйцо. Можно опустить в холодную воду, чтобы смыть уксус.\n\nИсточник: Книга рецептов · 1, стр. 29.", "y": null, "fresh": false, "auto": false}, "K1-030": {"name": "Яичный блин с хумусом и шпинатом", "group": "Завтрак", "lines": [["egg", 100.0], ["c_тортилья", 60.0], ["c_хумус", 20.0], ["c_шпинат", 40], ["c_курица-вар", 100.0]], "method": "Взбалтываем 2 яйца, выливаем на разогретую сковородку, как блин. Сверху выкладываем лепешку тортилиа, накрываем крышкой. Переворачиваем и обжариваем с другой стороны, лепешкой вниз. Смазываем блин с хумусом, добавляем курицу, порезанную, шпинат, по желанию можно добавить порезанную помидорку.\n\nИсточник: Книга рецептов · 1, стр. 30. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K1-032": {"name": "Бейглы", "group": "Перекус", "lines": [["c_творог5", 150], ["egg", 100], ["c_мука-рис", 30], ["c_сыр", 30]], "method": "1. Смешать творог, яйцо, натертый сыр, муку и соль, разделить тесто на 4 части 2. Раскатать колбаски, соединить кончики 3. Смазать желтком и посыпать кунжутом 4. Выпекать 20-25 минут при 180 градусах до красивой корочки\n\nИсточник: Книга рецептов · 1, стр. 32. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: специи/соль.", "y": null, "fresh": false, "auto": true}, "K1-033": {"name": "Блинный ПП торт", "group": "Перекус", "lines": [["c_белок", 66], ["milk", 200.0], ["oat", 50.0], ["c_какао", 14.0], ["c_кокос-молоко", 500.0], ["c_желток", 17], ["c_крахмал", 20.0]], "method": "Смешиваем все ингредиенты для теста, выпекаем блинчики на хорошо разогретой сковородке с 2 сторон. Для крема - смешиваем желтки и крахмал, постепенно вводим молоко, отправляем на плиту, постоянно помешивая, до загустения. собираем торт и ставим в холодильник на час.\n\nИсточник: Книга рецептов · 1, стр. 33. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: разрыхлитель, стевия.", "y": null, "fresh": false, "auto": true}, "K1-034": {"name": "Булочки из чечевицы", "group": "Перекус", "lines": [["c_чечевица-кр", 160.0], ["c_масло-льн", 5], ["c_псиллиум", 25.0]], "method": "Замочить чечевивицу на ночь. Взбить блендером до однородной массы чечевицу с водой, маслом, солью. Добаввить рисовую муку - 50 гр., разрыхлитель и псилиум. Перемешать, оставить на10 минут. Мокрыми руками сформировать шарики, посыпать льняными или другими семечками, выпекать в духовке 40-50 минут, при тмпературе 180 градусов.\n\nИсточник: Книга рецептов · 1, стр. 34. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: разрыхлитель, специи/соль.", "y": null, "fresh": false, "auto": true}, "K1-035": {"name": "Баклажаны с сыром", "group": "Перекус", "lines": [["c_баклажан", 200.0], ["egg", 50.0], ["c_творог5", 150], ["c_сыр", 30], ["c_зелень", 10.0]], "method": "Смешать творог с яйцами и специями. Из баклажана вырезать мякоть и натереть на крупной терке. Смешать мякоть с творогом. Наполнить начинкой форму из баклажана. Сам баклажан от кожуры не чистим. Запекать при температуре 200 градусов в течении 15 минут. Добавить твердый сыр и запекать еще 5 минут.\n\nИсточник: Книга рецептов · 1, стр. 35. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: специи/соль.", "y": null, "fresh": false, "auto": true}, "K1-036": {"name": "Баклажаны с творожным сыром и чесноком", "group": "Перекус", "lines": [["c_сливочн-сыр", 140.0], ["c_зелень", 10], ["c_баклажан", 250.0], ["oil", 10], ["c_чеснок", 5.0], ["c_орехи", 50.0]], "method": "Пастообразный творог смешиваем с грецким орехом, мелко нарубленным, чесноком и зеленью. Баклажаны промываем, режим тонкими пластиками, обжариваем с 2 сторон, на сковородке. Каждый пластик начиняем творожной начинкой и сворачиваем в рулетики.\n\nИсточник: Книга рецептов · 1, стр. 36. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K1-037": {"name": "Банановая запеканка", "group": "Завтрак", "lines": [["c_творог5", 560.0], ["egg", 50.0], ["banana", 240.0], ["oat", 50.0]], "method": "Творог протираем, смешиваем с яйцами и мукой, тщательно вымешать. Бананы растереть и добавить в творожную массу. Выложить в форму для запекания. Выпекать при температуре 180 градусов, до румяной корочки.\n\nИсточник: Книга рецептов · 1, стр. 37. По вкусу: стевия.", "y": null, "fresh": false, "auto": true}, "K1-038": {"name": "Банановый десерт", "group": "Перекус", "lines": [["c_творог-мягк", 100.0], ["c_миндаль", 30.0], ["c_какао", 30.0], ["oat", 50.0], ["c_желатин", 10], ["banana", 240.0]], "method": "Пюрируем 2 банана. Желатин растворяем в воде по инструкции. Добавляем к желатину банан, муку, какао и стевию. Все перемешиваем и варим на медленном огне. Добавляем творог, все взбиваем. Замешиваем орешки и убираем в холодильник. Сверху можно украсить ягодами и лепестками миндаля.\n\nИсточник: Книга рецептов · 1, стр. 38. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: стевия.", "y": null, "fresh": false, "auto": true}, "K1-039": {"name": "Баунти", "group": "Перекус", "lines": [["c_кокос-стружка", 10], ["c_творог5", 250.0], ["c_какао", 50.0], ["c_сметана", 30.0]], "method": "Смешиваем творог с ванилином и сметаной. Из полученной массы делаем небольшие колбаски- батончики. Далее готовим шоколадную глазурь. В кастрюлю добавляем: воду, стевию ‚ какао. И нагреваем полученную массу примерно 5-7 минут на среднем огне, постоянно перемешивая. С помощью кухонной кисточки обмазываем полученные батончики шоколадным соусом. Сверху посыпаем каждый батончик кокосовой стружкой и отправляем в холодильник на 30 минут.\n\nИсточник: Книга рецептов · 1, стр. 39. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: ванилин, стевия.", "y": null, "fresh": false, "auto": true}, "K1-040": {"name": "Бутерброд с тунцом", "group": "Перекус", "lines": [["c_хлеб-цз", 30.0], ["c_тунец", 20.0], ["lettuce", 30], ["cucumber", 20.0], ["egg", 100]], "method": "Хлеб смазываем тунцом, сверху лист салата. Отваренное яйцо режем на тонкие пластики, огурец режем на тонкие пластики. После салата - яйцо и закрываем все пластиком огурца.\n\nИсточник: Книга рецептов · 1, стр. 40. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K1-041": {"name": "Вишнево-творожный маккейк", "group": "Перекус", "lines": [["c_творог-мягк", 50.0], ["oat", 25.0], ["c_вишня", 50.0], ["egg", 50.0], ["yog", 150], ["c_орехи", 15]], "method": "Вишню измельчить в пюре, с помощью блендара. Добавить творог и яйцо и смешать в однородную массу. Всыпать смесь из муки, стевии, разрыхлителя и ванилина, хорошо перемешать вилкой. Выпекать в духовка -15-20 минут. Готовый маккейк остудить, намазать йогуртом, украсить сверху вишней и орешками.\n\nИсточник: Книга рецептов · 1, стр. 41. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: ванилин, разрыхлитель, стевия.", "y": null, "fresh": false, "auto": true}, "K1-042": {"name": "Вишневый Смузи", "group": "Перекус", "lines": [["banana", 360.0], ["c_вишня", 60], ["c_лимон", 100.0]], "method": "Поместите все ингредиенты в блендер и перемешайте до однородной консистенции. Разлейте по стаканам и поставьте на 30 минут в холодильник.\n\nИсточник: Книга рецептов · 1, стр. 42. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": true, "auto": true}, "K1-043": {"name": "Десерт Зебра", "group": "Перекус", "lines": [["c_сметана", 20], ["c_творог5", 250.0], ["c_какао", 50.0], ["c_желатин", 10]], "method": "Желатин залейте водой, выдержите до набухания, затем распустите на водяной бане. Творог протрите, смешайте со сметаной и подсластителем. Добавьте приготовленный желатин, перемешайте и разделите массу пополам. В одну часть добавьте растопленное какао, перемешайте. В другую - ванилин. В десертный стаканчик (баночку) - выкладывайте, чередуя, по 1-2 ч. Ложки белой и темной массы. Поставьте стаканчик в холодильник на 1-2 часа.\n\nИсточник: Книга рецептов · 1, стр. 43. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: ванилин, стевия.", "y": null, "fresh": false, "auto": true}, "K1-044": {"name": "Летний десерт", "group": "Перекус", "lines": [["banana", 120.0], ["c_ряженка", 450.0], ["c_желатин", 10.0], ["c_клубника", 80], ["c_кокос-стружка", 10]], "method": "Растопите желатин. В формы, выложите, порезанные банан и ягоды. Смешайте ряженку, стевию и желатин и залейте, получившейся смесью фрукты. Сверху можно посыпать кокосовой стружкой . Убрать в холодильник на 2 часа.\n\nИсточник: Книга рецептов · 1, стр. 44. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: стевия.", "y": null, "fresh": false, "auto": true}, "K1-045": {"name": "Галета с инжиром (можно другой фрукт)", "group": "Перекус", "lines": [["c_тесто-фило", 40], ["c_инжир", 50], ["c_сыр", 30], ["c_масло-гхи", 5], ["c_зелень", 10]], "method": "Наложить листочки теста, друг на друга, смазав каждый слой маслом гхи. Сыр бри, нарезать тонкими ломтиками, выложить на тесто, Сверху порезанный инжир или другой фрукт и веточку тимьяна. Заваорачиваем края теста и ставим в духовку на 20 минкт при температуре 200 градусов.\n\nИсточник: Книга рецептов · 1, стр. 45. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K1-046": {"name": "Диетическая шарлотка", "group": "Перекус", "lines": [["c_кефир", 150.0], ["c_овсянка", 250.0], ["apple", 500.0], ["egg", 150.0]], "method": "Смешать хлопья, яйца, добавить кефир, до консистенции, блинного теста. Дать немного постоять, чтобы хлопья набухли. Добавить разрыхлитель и по желанию корицу (ваниль, какао). Выложить порезанные яблоки, в форму для запекания, предварительно, смазанную каплей масла и залить, получившейся смесью. Выпекать 50 минут при температуре 200 градусов.\n\nИсточник: Книга рецептов · 1, стр. 46. По вкусу: разрыхлитель.", "y": null, "fresh": false, "auto": true}, "K1-047": {"name": "Диетический Маффин", "group": "Перекус", "lines": [["oat", 150.0], ["egg", 50.0], ["c_какао", 20.0], ["apple", 150.0], ["c_творог5", 50.0], ["oil", 15.0]], "method": "Взбиваем яйца и подсластитель в крепкую пену. Смешиваем - муку, разрыхлитель, ванилин, какао. Ввести яичную смесь и тщательно перемешать. Почищенныне кусочки яблока - мелко режем. Добавить в мучную смесь творог, оливковое масло и яблоко. Перемешать. Влажными руками сформировать небольшие шарики. Поместить в разогретую духовку и запекать 30 минут, при температуре 200 градусов.\n\nИсточник: Книга рецептов · 1, стр. 47. По вкусу: ванилин, разрыхлитель, стевия.", "y": null, "fresh": false, "auto": true}, "K1-048": {"name": "Запеканка с ягодой", "group": "Завтрак", "lines": [["c_ряженка", 300.0], ["c_творог5", 150], ["c_крахмал", 20.0], ["egg", 150.0], ["c_вишня", 60]], "method": "Взбиваем творог с яйцами, подсластителем и ванилином. Добавляем крахмал и ряженку. взбиваем еще. Творожная масса не должна быть жидкой, по консистенции, как сметана. Добавляем ряженку, все хорошо перемешиваем. Выкладываем полученную массу в форму для выпечки, украшаем сверху ягодами и ставим в разогретую духовку на 55-40 минут. После выпекания, духовку не открываем.Оставляем запеканку в ней до полного остывания.\n\nИсточник: Книга рецептов · 1, стр. 48. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: стевия.", "y": null, "fresh": false, "auto": true}, "K1-049": {"name": "Запеканка из кабачков", "group": "Завтрак", "lines": [["c_кабачок", 200.0], ["egg", 100.0], ["c_шпинат", 40], ["c_сыр", 40.0]], "method": "Нарезаем кабачок кольцами, выложить в форму для запекания, взбить яйца со шпинатом, вылить на кабачки, посыпать тертым сыром, еще слой кабачков и посыпать тертым сыром.\n\nИсточник: Книга рецептов · 1, стр. 49. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K1-050": {"name": "Имбирный шот", "group": "Другое", "lines": [["c_имбирь", 20.0], ["c_лимон", 30], ["c_мёд", 7.0]], "method": "Загрузить порезанный имбирь и лимон в соковыжималку.В сок добавить куркуму, мед и немного воды. Перелить по бутылочкам и пить по 50 мл. в день\n\nИсточник: Книга рецептов · 1, стр. 50. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: специи/соль.", "y": null, "fresh": false, "auto": false}, "K1-051": {"name": "Кабачковая пицца", "group": "Перекус", "lines": [["c_кабачок", 150.0], ["c_мука", 40.0], ["egg", 100.0], ["c_зелень", 10], ["chicken", 100.0], ["tomato", 120.0], ["c_сыр", 80.0]], "method": "Натираем кабачок, сливаем лишнюю воду, добавляем муку, яйца. Распределяем массу по пергаменту, запекаем в духовке 20 минут. Перевернуть и ещё 15 минут. Достать пиццу, выложить обжаренное куриное филе, помидоры, посыпать натертым сыром. Поставим еще на10 минут.\n\nИсточник: Книга рецептов · 1, стр. 51. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K1-052": {"name": "Кабачки запеченые", "group": "Перекус", "lines": [["c_кабачок", 200.0], ["oil", 20.0], ["c_чеснок", 5]], "method": "Кабачки нарезаем и выкладываем в форму для запекания. Соединяем: масло, соль, паприку, специи и рубленый чеснок. Смазываем полученной смесью кабачки. Запекаем в разогретой духовке до 180 градусов, на 30 минут.\n\nИсточник: Книга рецептов · 1, стр. 52. Часть граммов ориентировочная — поправьте, если в книге иначе. Болгарский перец убран из состава.", "y": null, "fresh": false, "auto": true}, "K1-053": {"name": "Конфеты из тыквенных семечек", "group": "Перекус", "lines": [["c_тыква", 150], ["c_финики", 100.0]], "method": "Все измельчаем в блендере., до однородного состояния, формируем шарики, и обмакиваем в обсыбку (мелко нарубленные тыквенные семечки)\n\nИсточник: Книга рецептов · 1, стр. 53. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K1-054": {"name": "Кростата с фруктами", "group": "Перекус", "lines": [["c_мука-рис", 150.0], ["c_масло-гхи", 40.0], ["c_рикотта", 60], ["c_манго", 100], ["c_лимон-сок", 5.0]], "method": "Для теста, смешиваем муку, растопленное сливочное масло, 50 мл. воды и стевию. Ставим тесто на 15-20 минут в холодильник, затем раскатывакем слой теста, смазывам рикоттой, выкладываем порезанные фрукты, поливаем соком лимона, заворачиваеем края, ставим в духовку на 15-20 минут.\n\nИсточник: Книга рецептов · 1, стр. 54. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: стевия.", "y": null, "fresh": false, "auto": true}, "K1-055": {"name": "Морковные пряники", "group": "Перекус", "lines": [["c_морковь", 100.0], ["c_апельсин", 150.0], ["egg", 100.0], ["c_пшено", 40.0], ["c_курага", 50.0]], "method": "Измельчить в блендере: морковь, апельсин, яйца и отруби.Сформировать шарики, внутрь положить сухофрукты. Получившиеся пряники выложить на лист пергамента или силиконовый коврик. Запекать в духовке в течении 20 минут.\n\nИсточник:  100], ["c_тунец", 80]], "method": "Отвариваем яйца до готовности, разрезаем яйцо вертикально на 2 части. Аккуратно достаем желток из белка. Смешиваем тунец, желток, перец, соль и нашинковываем белки полученной массой.\n\nИсточник: Книга рецептов · 2, стр. 28. Часть граммов ориентировочная — поправьте, если в книге иначе. Болгарский перец убран из состава.", "y": null, "fresh": false, "auto": true}, "K2-029": {"name": "Яблочный крамбл", "group": "Перекус", "lines": [["c_овсянка", 70.0], ["c_творог-мягк", 60.0], ["apple", 180.0]], "method": "Яблоко очищаем, режим на кубики и отправляем в микроволновку на 3 минуты. Овсяные хлопья смешиваем со стевией и творогом, добавляем к яблоку и отправляем еще на 5-4 минуты в микроволновку. Подаем с творогом, стевией и украшаем ягодами.\n\nИсточник: Книга рецептов · 2, стр. 29. По вкусу: стевия.", "y": null, "fresh": false, "auto": true}, "K2-031": {"name": "Буратта с томатами", "group": "Перекус", "lines": [["c_моцарелла", 50], ["tomato", 120], ["c_базилик", 5]], "method": "Томаты нарезать тонкими пластиками, выложить на плоскую тарелку. В середину выложить буратту. Заправить оливковым маслом, мелко нарубленным чесноком и базиликом, все посолить и украсить базиликом. Порезать хлеб, обжарить на сковородке, сбрызнуть оливковым маслом, добавить специи.\n\nИсточник: Книга рецептов · 2, стр. 31. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: специи/соль.", "y": null, "fresh": false, "auto": true}, "K2-032": {"name": "Высокобелковый салат", "group": "Салат", "lines": [["apple", 100.0], ["c_батат", 80.0], ["c_тыква", 150], ["c_изюм", 10.0], ["c_фета", 20.0], ["c_шпинат", 40]], "method": "Режем все ингредиенты, заправляем оливковым или конопляным маслом. Добавляем немного соли.\n\nИсточник: Книга рецептов · 2, стр. 32. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": true, "auto": true}, "K2-033": {"name": "Салат с курицей и авокадо", "group": "Салат", "lines": [["c_курица-копч", 80], ["c_картофель", 150], ["c_зелень", 10], ["cucumber", 100], ["c_фета", 40], ["c_авокадо", 70]], "method": "Сыр нарезаем кубиками, батат запекаем в духовке . Курицу и авокадо нарезаем кубиками, добавляем зелень. Заправка: горчица зернистая + оливковое масло и специи.\n\nИсточник: Книга рецептов · 2, стр. 33. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": true, "auto": true}, "K2-034": {"name": "Салат с авокадо, курицей и кукурузой", "group": "Салат", "lines": [["c_авокадо", 70], ["tomato", 120], ["c_кукуруза-конс", 50], ["c_курица-вар", 120], ["c_лук-зел", 10], ["c_зелень", 10]], "method": "Нарезаем авокадо и помидоры, по желанию можно добавить лук. Режем зелень,высыпаем 1/2 банки кукурузы. Заправляем оливковым маслом+горчицей.\n\nИсточник: Книга рецептов · 2, стр. 34. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": true, "auto": true}, "K2-035": {"name": "Тёплый салат с бататом и картофелем", "group": "Гарнир", "lines": [["c_картофель", 150], ["c_батат", 400.0], ["c_руккола", 30], ["c_авокадо", 75.0], ["c_фета", 40], ["tomato", 120.0], ["c_тыква", 150]], "method": "Картошку и батат отварить до полуготовности, затем нарезать дольками, смазать маслом со специями и запекать в духовке. 15 минут. Нарезаем авокадо, добавляем рукколу и сыр, посыпаем тыквенными семечками, заправляем оливковым маслом и лимонным соком.\n\nИсточник: Книга рецептов · 2, стр. 35. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K2-036": {"name": "Салат с курицей и киноа", "group": "Салат", "lines": [["chicken", 300.0], ["c_киноа", 50.0], ["c_зелень", 10], ["cucumber", 100.0], ["tomato", 100.0], ["c_фета", 100.0]], "method": "Отвариваем куриное филе, нарезаем кубиками. режем овощи, сыр и зелень. заправляем все оливковым маслом, солим, можно добавить гранат.\n\nИсточник: Книга рецептов · 2, стр. 36. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": true, "auto": true}, "K2-037": {"name": "Салат с креветками", "group": "Салат", "lines": [["c_руккола", 30], ["c_авокадо", 150.0], ["c_креветки", 500.0], ["c_мандарин", 80.0], ["c_сыр", 50.0], ["oil", 46.0], ["c_мёд", 7.0], ["c_горчица", 20.0]], "method": "Обжариваем креветки, нарезаем рукколу, авокадо, мандарин, добавляем креветки. Для соуса смешиваем: Мёд+горчицу+масло. Сверху посыпаем сыр пармезан\n\nИсточник: Книга рецептов · 2, стр. 37. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": true, "auto": true}, "K2-038": {"name": "Салат белковый с крабовым мясом", "group": "Салат", "lines": [["c_курица-вар", 100.0], ["c_творог-мягк", 70.0], ["c_крабовое", 70.0]], "method": "Куриное филе отвариваем и нарезаем кубиками. Крабовое мясо нарезаем кубиками. Заправить все мягким творогом, хорошо перемешать. Можно посыпать зеленью.\n\nИсточник: Книга рецептов · 2, стр. 38.", "y": null, "fresh": true, "auto": true}, "K2-039": {"name": "Зеленый салат с тунцом", "group": "Салат", "lines": [["c_тунец", 200.0], ["tomato", 240.0], ["lettuce", 30], ["c_лимон-сок", 10.0], ["oil", 9.2], ["egg", 100.0], ["c_руккола", 100.0]], "method": "Выкладываем на дно посуды листья салата. Отваренные яйца режем кубиками, выкладываем тунец. Режем помидоры и перец, добавляем рукколу. Заправляем все оливковым маслом и сбрызгиваем соком лимона.\n\nИсточник: Книга рецептов · 2, стр. 39. Часть граммов ориентировочная — поправьте, если в книге иначе. Болгарский перец убран из состава.", "y": null, "fresh": true, "auto": true}, "K2-040": {"name": "Капустный салат с лимонной заправкой", "group": "Салат", "lines": [["c_капуста", 300.0], ["c_морковь", 100.0], ["c_зелень", 15.0], ["c_йогурт", 30.0], ["c_лимон-сок", 10.0], ["c_горчица", 20.0]], "method": "Нашинковываем капусту, натираем морковь на терке. Взбиваем йогурт, горчицу, воду и лимонный сок. Добавляем овощи и мелко порезанный укроп. Все перемешиваем. Можно добавить щепотку соли.\n\nИсточник: Книга рецептов · 2, стр. 40.", "y": null, "fresh": true, "auto": true}, "K2-041": {"name": "Куриный салат с шампиньонами", "group": "Салат", "lines": [["c_курица-вар", 200.0], ["egg", 100.0], ["c_лук", 50.0], ["c_чеснок", 10.0], ["c_творог-мягк", 150.0], ["c_грибы", 100.0]], "method": "Куриное филе отвариваем и нарезаем кубиками. Лук обжариваем на капле растительного масла или антипригарной сковороде, через 2 минуты добавляем порезанный шампиньоны. Яйца взбиваем, добавляем соль и обжариваем на сковородке, как блин, затем режем его на кусочки. Творог смешиваем с чесноком. Смешиваем все ингредиенты и оставляем в холодильнике на $0 минут.\n\nИсточник: Книга рецептов · 2, стр. 41.", "y": null, "fresh": true, "auto": true}, "K2-042": {"name": "Салат весенний", "group": "Салат", "lines": [["c_капуста-пекин", 300.0], ["tomato", 100.0], ["cucumber", 200.0], ["oil", 30.0], ["radish", 200.0], ["c_зелень", 30.0]], "method": "Капусту мелко порезать, посолить и помять руками. Добавить нарезанные огурцы. редис и петрушку. В конце добавить нарезанный помидор. Все хорошо перемешиваем. Заправить оливковым маслом.\n\nИсточник: Книга рецептов · 2, стр. 42.", "y": null, "fresh": true, "auto": true}, "K2-043": {"name": "Салат витаминный", "group": "Салат", "lines": [["c_капуста-пекин", 500.0], ["tomato", 150.0], ["cucumber", 100.0], ["oil", 20.0], ["c_зелень", 30.0]], "method": "Все овощи режем мелко ‚ перемешиваем и заправляем оливковым маслом.\n\nИсточник: Книга рецептов · 2, стр. 43. Болгарский перец убран из состава.", "y": null, "fresh": true, "auto": true}, "K2-044": {"name": "Салат вкуснятина", "group": "Салат", "lines": [["c_креветки", 100], ["egg", 200.0], ["lettuce", 100.0], ["tomato", 100.0], ["c_лимон-сок", 10.0], ["oil", 4.6], ["c_чеснок", 5]], "method": "Креветки отварить до готовности - варить 7 минут. Салат порезать. Помидор и вареные яйца порезать кубиками. Чеснок мелко нарезать. Заправить все оливковым маслом и лимонным соком. Добавить щепотку соли.\n\nИсточник: Книга рецептов · 2, стр. 44. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": true, "auto": true}, "K2-045": {"name": "Салат Греческий", "group": "Салат", "lines": [["lettuce", 100.0], ["c_томаты-черри", 100.0], ["cucumber", 100.0], ["c_брынза", 50.0], ["c_маслины", 50.0], ["c_чеснок", 5], ["oil", 10.0]], "method": "Нарезаем кубиками овощи и салат, добавляем мелко нарезанный чеснок. Кубиками режем сыр и кружками нарезаем маслины, все перемешиваем и заправляем оливковым маслом. Посыпаем сверху перцем.\n\nИсточник: Книга рецептов · 2, стр. 45. Часть граммов ориентировочная — поправьте, если в книге иначе. Болгарский перец убран из состава.", "y": null, "fresh": true, "auto": true}, "K2-046": {"name": "Салат из авокадо с тунцом", "group": "Салат", "lines": [["c_авокадо", 150.0], ["tomato", 120.0], ["c_тунец", 80], ["c_зелень", 70.0], ["c_лимон-сок", 10.0], ["oil", 10]], "method": "Тунец перекладываем в салатницу, формируя нижний слой,. Далее выкладываем нарезанный мелкими кусочками помидор. Авокадо чистим, режем кусочками, сбрызгиваем соком лимона и выкладываем третьим слоем на помидор. Сверху выкладываем порезанный укроп и добавляем оливковое масло.\n\nИсточник: Книга рецептов · 2, стр. 46. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": true, "auto": true}, "K2-047": {"name": "Салат из капусты и авокадо", "group": "Салат", "lines": [["c_авокадо", 150.0], ["tomato", 400.0], ["c_капуста-пекин", 150.0], ["oil", 9.2], ["c_маслины", 180.0]], "method": "Пекинскую капусту мелко нарезать. Помидоры нарезать кубиками. Болгарский перец нарезать квадратиками. Авокадо очистить и нарезать кубиками. Маслины разрезать пополам. В салатнике смешать все ингредиенты, заправить маслом.\n\nИсточник: Книга рецептов · 2, стр. 47. Болгарский перец убран из состава.", "y": null, "fresh": true, "auto": true}, "K2-048": {"name": "Салат из капусты с огурцами", "group": "Салат", "lines": [["c_капуста", 300.0], ["c_лук-зел", 50.0], ["c_зелень", 50.0], ["cucumber", 200.0], ["oil", 4.6]], "method": "Нашинковываем капусту. Лук, укроп и огурец нарезаем. Добавляем немного соли. Перемешиваем все ингредиенты. Заправляем салат оливковым маслом.\n\nИсточник: Книга рецептов · 2, стр. 48.", "y": null, "fresh": true, "auto": true}, "K2-049": {"name": "Салат из капусты с яблоком", "group": "Салат", "lines": [["c_капуста", 70.0], ["apple", 100.0], ["oil", 27.6]], "method": "Капусту нашинковать тонкой соломкой. Обмять капусту руками. Яблоко почистить и натереть на крупной терке. Смешать яблоко и капусту. Заправить оливковым маслом.\n\nИсточник: Книга рецептов · 2, стр. 49.", "y": null, "fresh": true, "auto": true}, "K2-050": {"name": "Салат из красной фасоли и тунца", "group": "Салат", "lines": [["c_фасоль", 200.0], ["c_томаты-черри", 200.0], ["c_тунец", 300.0], ["c_лимон-сок", 10.0], ["oil", 9.2]], "method": "В миске смешиваем кусочки тунца, фасоль и разрезанные на половинки помидоры черри. Заправляем все оливковым маслом и лимонным соком, перчим. Перемешиваем все ингредиенты.\n\nИсточник: Книга рецептов · 2, стр. 50. По вкусу: специи/соль.", "y": null, "fresh": true, "auto": true}, "K2-051": {"name": "Салат из морской капусты", "group": "Салат", "lines": [["lettuce", 100.0], ["cucumber", 100.0], ["c_морская-капуста", 80], ["c_сметана", 20]], "method": "Нарезаем огурцы, рвем листья салата, добавляем морскую капусту, и специи. Заправляем блюдо сметаной или натуральным йогуртом.\n\nИсточник: Книга рецептов · 2, стр. 51. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": true, "auto": true}, "K2-052": {"name": "Салат из Моцареллы с Томатами", "group": "Салат", "lines": [["tomato", 200.0], ["c_моцарелла", 200.0], ["c_руккола", 50.0], ["c_орехи", 30.0], ["oil", 6.4]], "method": "Нарезаем помидоры и сыр кольцами. На дно тарелки выкладываем рукколу. Сверху поочередно выкладываем помидоры и сыр. Все посыпаем кедровыми орехами и поливаем оливковым маслом.\n\nИсточник: Книга рецептов · 2, стр. 52.", "y": null, "fresh": true, "auto": true}, "K2-053": {"name": "Салат из свеклы и брынзы", "group": "Салат", "lines": [["c_брынза", 70.0], ["c_кунжут", 10.0], ["c_свекла", 150.0], ["lettuce", 50.0], ["oil", 30.0]], "method": "Свеклу моем, заматываем в фольгу и запекаем в духовке 40-50 минут. Чистим ее от кожуры и нарезаем тонкими пластиками. Брынзу нарезаем на кусочки. На тарелку выкладываем листья салата, затем запеченную свеклу, порезанную брынзу. Сверху посыпаем семенами кунжута и поливаем оливковым маслом.\n\nИсточник: Книга рецептов · 2, стр. 53.", "y": null, "fresh": true, "auto": true}, "K2-054": {"name": "Салат из свеклы с грецким орехом", "group": "Салат", "lines": [["c_чернослив", 250.0], ["c_орехи", 100.0], ["c_свекла", 100.0], ["c_фета", 200.0]], "method": "В воде отвариваем свеклу, затем натираем ее на терке. Нарезаем мелко чернослив и грецкий орех. На кубики режем сыр. Все перемешываем.\n\nИсточник: Книга рецептов · 2, стр. 54.", "y": null, "fresh": true, "auto": true}, "K2-055": {"name": "Салат Каприз", "group": "Салат", "lines": [["apple", 100.0], ["cucumber", 100.0], ["c_сметана", 50.0], ["radish", 300.0]], "method": "Редис почистить и мелко нарезать. Огурец порезать кубиками и смешать с редисом. Яблоко очищаем от сердцевины и кожуры и также нарезать кубиками. Все перемешать и заправить сметаной.\n\nИсточник: Книга рецептов · 2, стр. 55.", "y": null, "fresh": true, "auto": true}, "K2-056": {"name": "Салат ЛЕТНИЙ", "group": "Салат", "lines": [["chicken", 200.0], ["cucumber", 100.0], ["c_сельдерей", 100.0], ["c_томаты-черри", 200.0], ["c_капуста-пекин", 100.0], ["oil", 30.0]], "method": "Курицу отварить и порезать кубиками. Капусту мелко нашинковать, все остальные ингредиенты порезать кубиками, поперчить, посолить и заправить оливковым маслом.\n\nИсточник: Книга рецептов · 2, стр. 56.", "y": null, "fresh": true, "auto": true}, "K2-057": {"name": "Салат с авокадо и брокколи", "group": "Салат", "lines": [["c_авокадо", 100.0], ["tomato", 120], ["c_брокколи", 100.0], ["cucumber", 100.0], ["oil", 9.2], ["c_лимон-сок", 30.0], ["c_семечки", 10.0]], "method": "Отвариваем брокколи, режем мелко. Помидор, огурец, перец и авокадо режим кубиками и сбрызгиваем лимонным соком. Перчим и поливаем оливковым маслом. Сверху посыпаем кунжутными семечками.\n\nИсточник: Книга рецептов · 2, стр. 57. Часть граммов ориентировочная — поправьте, если в книге иначе. Болгарский перец убран из состава.", "y": null, "fresh": true, "auto": true}, "K2-058": {"name": "Салат из брокколи и оливок", "group": "Салат", "lines": [["lettuce", 100.0], ["tomato", 120], ["c_брокколи", 500.0], ["c_маслины", 100.0], ["oil", 9.2]], "method": "Отвариваем брокколи, режем мелко, далее выкладываем нарезанный мелкими кусочками помидор, добавляем оливки и листья салата. Перчим и поливаем оливковым маслом.\n\nИсточник: Книга рецептов · 2, стр. 58. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": true, "auto": true}, "K2-059": {"name": "Салат с кальмарами", "group": "Салат", "lines": [["c_кальмар", 200.0], ["egg", 50.0], ["lettuce", 100.0], ["cucumber", 100.0], ["c_лимон-сок", 10.0], ["radish", 50.0], ["oil", 4.6], ["c_соевый-соус", 10.0]], "method": "Готовим кальмары 2 минуты, посыпаем солью. Режем огурец. Яйцо отвариваем, режем кубиками, рвем салат и выкладываем на тарелку. Добавляем редиску. Перемешиваем все ингредиенты. Заправка для салата -соевый соус, щепотка соли, оливковое масло и свежий лимонный сок. И заправляем салат.\n\nИсточник: Книга рецептов · 2, стр. 59.", "y": null, "fresh": true, "auto": true}, "K2-060": {"name": "Салат с капустой", "group": "Салат", "lines": [["c_капуста", 400.0], ["c_морковь", 150.0], ["c_лимон-сок", 5.0], ["oil", 4.6]], "method": "Перец нарезать тонкими полосками. Капусту нашинковать тонкими ленточками, присыпать солю и размять руками. В салатнике смешать капусту с перцем, сбрызнуть уксусом. Морковку натереть на терке, смешать с капустой, заправить оливковым маслом.\n\nИсточник: ый сок и раздавленный, либо мелко порезанный чеснок. Все хорошо перемешиваем.\n\nИсточник: Книга рецептов · 2, стр. 64. Часть граммов ориентировочная — поправьте, если в книге иначе. Болгарский перец убран из состава.", "y": null, "fresh": true, "auto": true}, "K2-065": {"name": "Салат с креветками и рукколой", "group": "Салат", "lines": [["c_креветки", 150.0], ["c_томаты-черри", 80], ["c_руккола", 150.0], ["c_уксус-бальз", 40.0], ["c_лимон-сок", 10.0], ["oil", 9.2]], "method": "В салатницу выкладываем листья рукколы. Креветки отвариваем, помидоры черри нарезаем. Все ингредиенты перемешиваем и заливаем оливковым маслом, смешанным с лимонным соком.\n\nИсточник: Книга рецептов · 2, стр. 65. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: специи/соль.", "y": null, "fresh": true, "auto": true}, "K2-066": {"name": "Салат с семгой", "group": "Салат", "lines": [["c_томаты-черри", 200.0], ["c_маслины", 20], ["c_зелень", 10], ["c_лимон-сок", 10], ["oil", 10], ["c_семга", 60], ["cucumber", 100.0]], "method": "Огурец режем кольцами. Семгу режем пластиками. Маслины режем кольцами. Укроп мелко измельчаем, добавляем помидоры . Смешиваем сок лимона и оливковое масло и заправляем овощи с рыбой.\n\nИсточник: Книга рецептов · 2, стр. 66. Часть граммов ориентировочная — поправьте, если в книге иначе. Болгарский перец убран из состава.", "y": null, "fresh": true, "auto": true}, "K2-067": {"name": "Салат Щетка", "group": "Салат", "lines": [["c_капуста", 250.0], ["c_морковь", 150.0], ["c_свекла", 200.0], ["oil", 30.0], ["c_лимон-сок", 10]], "method": "Капусту тонко шинкуем. Морковь и свеклу натираем на терке. Добавляем зелень. Заправляем оливковым маслом и лимонным соком.\n\nИсточник: Книга рецептов · 2, стр. 67. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": true, "auto": true}, "K2-068": {"name": "Средиземноморское наслаждение", "group": "Перекус", "lines": [["c_томаты-черри", 200.0], ["c_маслины", 100.0], ["c_зелень", 10], минут. Добавляем йогурт и тушим еще 5 минут.\n\nИсточник: Книга рецептов · 3, стр. 4.", "y": null, "fresh": false, "auto": true}, "K3-005": {"name": "Говядина с овощами", "group": "Основное", "lines": [["c_говядина", 300.0], ["c_овощи-микс", 100.0], ["c_лук", 100.0], ["c_томат-паста", 30.0]], "method": "Нарезать говядину тонкими ломтиками. Лук очистить и нарезать колечками. Мясо потушить на сковородке с водой, после его готовности, добавляем лук. После добавляем смесь замороженных овощей. Тушим на медленном огне, 10-15 минут, затем добавляем столовую ложку томатной пасты. Далее добавляем 200 мл. воды и специи, тушим до готовности.\n\nИсточник: Книга рецептов · 3, стр. 5. По вкусу: специи/соль.", "y": null, "fresh": false, "auto": true}, "K3-006": {"name": "Жульен с морепродуктами", "group": "Основное", "lines": [["c_креветки", 300.0], ["c_масло-слив", 10.0], ["c_мука-рис", 10.0], ["c_сливки", 200.0], ["c_сыр", 100.0], ["c_лук", 40]], "method": "Отвариваем и очищаем креветки и мидии. на кокосовом масле обжариваем мелко порезанный лук добавляем муку. сливки, соль. Как только соус будет готов, добавляем морепродукты. Затем раскладываем по формочкам и посыпаем мелко натертым сыром и в духовку на 7 минут\n\nИсточник: Книга рецептов · 3, стр. 6. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: специи/соль.", "y": null, "fresh": false, "auto": true}, "K3-007": {"name": "Запеканка из брокколи", "group": "Гарнир", "lines": [["c_брокколи", 400.0], ["c_рыба-жирн", 300.0], ["egg", 150.0], ["c_сливки", 75.0], ["c_моцарелла", 120.0], ["oil", 10]], "method": "Форму для запекания смазываем маслом. выложить брокколи, рыбу, залить все взбитой смесью из яиц и молока. Выложить сверху сыр и в духовку на 20-30 минут, при температуре 180 градусов.\n\nИсточник: Книга рецептов · 3, стр. 7. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K3-008": {"name": "Запеченная горбуша", "group": "Основное", "lines": [[ ": null, "fresh": false, "auto": true}, "K3-026": {"name": "Запеканка из курицы", "group": "Основное", "lines": [["chicken", 500.0], ["egg", 100.0], ["c_сметана", 100.0], ["tomato", 50.0]], "method": "Выкладываем филе на фольгу в форму для запекания. Взбиваем 2 яйца сор сметаной, добавляем черный перец и заливаем этой смесью курицу. Помидоры режем кружочками и выкладываем сверху. Можно посыпать зеленью. Ставим в духовку, разогретую до 200 градусов на 50 минут.\n\nИсточник: Книга рецептов · 3, стр. 26.", "y": null, "fresh": false, "auto": true}, "K3-027": {"name": "Котлеты из курицы и крабового мяса", "group": "Основное", "lines": [["chicken", 500.0], ["c_крабовое", 80], ["c_лук", 40], ["c_чеснок", 5]], "method": "Куриную грудку и крабовое мясо прокручиваем в блендере. Добавляем лук и чеснок. Лепим шарики и запекаем в духовке 40 минут при температуре 200 градусов.\n\nИсточник: Книга рецептов · 3, стр. 27. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K3-028": {"name": "Индейка с овощами", "group": "Основное", "lines": [["c_индейка", 150], ["c_кабачок", 150.0], ["c_грибы", 100], ["c_чеснок", 5], ["c_морковь", 200.0]], "method": "Индейку режем кубиками и обжариваем на капле масла. К ней добавляем нарезанные, отваренные грибы. Обжариваем 7-10 минут. Дале добавляем порезанный кабачок, морковь и чеснок. Можно добавить порезанную зелень. Заливаем водой, накрываем крышкой и тушим на медленном огне 15-20 минут.\n\nИсточник: Книга рецептов · 3, стр. 28. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K3-029": {"name": "Куриные шарики", "group": "Основное", "lines": [["c_куриный-фарш", 450.0], ["c_капуста", 100], ["egg", 100], ["c_морковь", 60]], "method": "Нарезаем зелень, капусту и натираем морковь на терке, добавляем яйцо, затем смешиваем их с фаршем. Формируем котлеты и выкладываем их на противень, застеленный бумагой для запекания. Ставим в духовку на 50-40 минут, при температуре 200 градусов.\n\nИсточник: Книга рецептов · 3, стр. 29. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K3-030": {"name": "Куриная грудка в пикантном соусе", "group": "Основное", "lines": [["chicken", 800.0], ["c_томат-паста", 10.0], ["c_чеснок", 50.0], ["c_соевый-соус", 32.0], ["oil", 13.0]], "method": "Томатную пасту с соевым соусом, паприкой, мелко пореаным чесноком и оливковым маслом, хорошо перемешиваем. В курином филе делаем надрезы - кармашки. Выкладываем филе на фольгу в форму для запекания. Промазываем, получившейся смесью курицу со всех сторон и поливаем сверху курицу. После этого накрываем куриное филе фольгой и ставим в духовку, разогретую до 200 градусов на 30 минут.\n\nИсточник: Книга рецептов · 3, стр. 30. Болгарский перец убран из состава.", "y": null, "fresh": false, "auto": true}, "K3-031": {"name": "Куриная грудка с овощами", "group": "Основное", "lines": [["chicken", 200.0], ["tomato", 100.0], ["c_чеснок", 5.0], ["c_морковь", 100.0]], "method": "Нарезаем куриную грудку на кусочки. Посыпаем кусочки паприкой, добавляем чеснок. Оставляем на 15 минут. Режем помидоры, морковь, перец, лук. Закладываем овощи и грудку в фольгу. Запекаем $30- 40 минут.\n\nИсточник: Книга рецептов · 3, стр. 31. Болгарский перец убран из состава.", "y": null, "fresh": false, "auto": true}, "K3-032": {"name": "Куриное филе под сливочным соусом", "group": "Основное", "lines": [["chicken", 700.0], ["c_грибы", 200.0], ["c_сливки", 45.0], ["c_сыр", 100.0], ["c_шпинат", 40]], "method": "Куриное филе режем на 2 части, отбиваем и маринуем. добавляем соль, паприка, чеснок, перец, розмарин. для соуса: на сковородке обжариваем шампиньоны, добавляем к ним сливки, сыр и тушим на среднем огне, добавляем шпинат. обжариваем уже замаринованную курицу с 2 сторон и сверху поливаем соусом.\n\nИсточник: Книга рецептов · 3, стр. 32. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K3-033": {"name": "Котлеты из фарша индейки", "group": "Основное", "lines": [["turkey", 500.0], ["c_лук", 10.0]], "method": "Смешиваем фарш и мелко порезанный лук, добавляем немного соли и специи. Лепим шарики, обжариваем по 5 минут на сковородке, добавляем немного воды и тушим под крышкой 25 минут.\n\nИсточник: Книга рецептов · 3, стр. 33.", "y": null, "fresh": false, "auto": true}, "K3-034": {"name": "Куриная грудка в кефире", "group": "Основное", "lines": [["chicken", 500.0], ["c_творог5", 200.0], ["c_кефир", 150.0], ["c_чеснок", 5.0], ["c_зелень", 50.0]], "method": "Смешиваем творог и кефир, добавляем мелко нарезанный чеснок и зелень. Смесь не должна быть жидкой. Филе нарезаем на крупные кусочки и каждый кусочек погружаем в смесь. Далее выкладываем на противень (на фольгу). Выпекаем 10 минут, затем, оставшейся смесью поливаем кусочки и ставим в духовку еще на 20-50 минут.\n\nИсточник: Книга рецептов · 3, стр. 34.", "y": null, "fresh": false, "auto": true}, "K3-035": {"name": "Куриные котлеты с брокколи", "group": "Основное", "lines": [["chicken", 200.0], ["c_брокколи", 200.0], ["egg", 50.0], ["c_чеснок", 5.0], ["c_зелень", 50.0]], "method": "Загружаем все в блендер и взбиваем до однородной массы. Формируем котлетки. Запекать в духовке в течении 40 минут, при температуре 200 градусов.\n\nИсточник: Книга рецептов · 3, стр. 35.", "y": null, "fresh": false, "auto": true}, "K3-036": {"name": "Куриное филе в перце", "group": "Основное", "lines": [["chicken", 200.0], ["c_зелень", 30.0]], "method": "Филе нарезаем кубиками. Укроп мелко режем. Перец разрезаем на пополам горизонтально, очищаем от перегородок и семян. Нафаршировать перец куриным филе с укропом. Завернуть плотно в фольгу и запекать в духовке 50 минут, при температуре 200 градусов.\n\nИсточник: Книга рецептов · 3, стр. 36. Болгарский перец убран из состава.", "y": null, "fresh": false, "auto": true}, "K3-037": {"name": "Куриные маффины", "group": "Основное", "lines": [["c_куриный-фарш", 400.0], ["c_кускус", 40.0], ["egg", 50.0], ["c_лук", 50.0], ["c_зелень", 10.0]], "method": "Залейте кус-кус кипятком, чтобы вода на1 см. превышала уровень крупы и оставьте на 10 минут. Добавьте к фаршу кус-кус, взбитый белок, мелко нарезанный лук и петрушку. Хорошо перемешайте. Выложите фарш, в смазанные маслом формы для кексов и выпекайте при температуре 200 градусов, в течении 40 минут.\n\nИсточник: Книга рецептов · 3, стр. 37.", "y": null, "fresh": false, "auto": true}, "K3-038": {"name": "Куриное филе с базиликом", "group": "Основное", "lines": [["c_кефир", 200], ["c_чеснок", 5]], "method": "Выкладываем филе на фольгу в форму для запекания. Добавляем мелко порезанный чеснок и специи. Перемешиваем кефир и базилик. И заливаем этой смесью курицу, отправляем в холодильник мариноваться. После этого накрываем куриное филе фольгой и ставим в духовку, разогретую до 200 градусов на 30 минут.\n\nИсточник: Книга рецептов · 3, стр. 38. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K3-039": {"name": "Куриное филе с начинкой фета", "group": "Основное", "lines": [["chicken", 500.0], ["c_фета", 70.0], ["c_зелень", 50.0]], "method": "Мелко режем зелень, добавляем сыр фета и все хорошо перемешиваем и разминаем вилкой. В курином филе делаем кармашки и начиняем их сыром м зеленью. Выкладываем филе на фольгу в форму для запекания. Посыпаем специями. Перемешиваем кефир и базилик. Ставим в духовку, разогретую до 200 градусов на 50-40 минут.\n\nИсточник: Книга рецептов · 3, стр. 39.", "y": null, "fresh": false, "auto": true}, "K3-040": {"name": "Куриное филе тушеное в сливках", "group": "Основное", "lines": [["chicken", 500.0], ["c_морковь", 120.0], ["c_сливки", 120.0], ["c_чеснок", 5.0], ["c_зелень", 50.0], ["c_брокколи", 500.0], ["c_сыр-творожн", 30], ["c_соевый-соус", 15], ["c_уксус-бальз", 10]], "method": "делаем соус для курицы: соевыи соус, уксус, мелко порезанный чеснок, перец молотый. В эту смесь опускаем порезанную кубиками курицу на 20-50 минут. В это время натираем на крупной терке морковку. Брокколи разбираем на соцветия. Курицу, вместе с маринадом выливаем на сковородку (без масла) и тушим в течении 5 минут. Добавляем морковь, тушим еще 5 минут, затем добавляем брокколи, еще на 5 минут. После этого заливаем сливками и посыпаем потертым сыром. Тушим в течении 15 минут под крышкой.\n\nИсточник: Книга рецептов · 3, стр. 40. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K3-041": {"name": "Курица в апельсиновом маринаде", "group": "Основное", "lines": [["chicken", 150], ["c_апельсин", 800.0], ["c_чеснок", 5]], "method": "Нарезаем чеснок четвертинками. Перец очищаем от семян, мелко режем, смешиваем его с чесноком и черным молотым перцем. Апельсин очистить и отжать сок. К специям выложить курицу, залить апельсиновым соком и поставить мариноваться на1-2 часа. Запекать в духовке, в фольге в течении 40 минут, при температуре 200 градусов.\n\nИсточник: Книга рецептов · 3, стр. 41. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: специи/соль.", "y": null, "fresh": false, "auto": true}, "K3-042": {"name": "Курица с овощами", "group": "Основное", "lines": [["chicken", 800.0], ["c_овощи-микс", 150], ["egg", 100.0], ["c_сливки", 50.0]], "method": "Форму для запекания смазываем оливковым маслом. Выкладываем овощную смесь и курицу, порезанную кубиками.В отдельной тарелке смешиваем яйца и сливки, добавляем соль. заливаем курицу и овощи, полученной смесью. ставим в духовку на 40 минут, при температуре 200 градусов.\n\nИсточник: Книга рецептов · 3, стр. 42. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K3-043": {"name": "Курица с грибами в кефире", "group": "Основное", "lines": [["chicken", 500.0], ["c_кефир", 150.0], ["c_грибы", 100.0], ["c_чеснок", 7.0]], "method": "Курицу мелко режем, маринуем в кефире с чесноком на 50 минут. Грибы мелко режем и тушим на сухой сковородке 3-5 минут. Затем добавляем курицу с кефиром к грибам и тушим до готовности. Масло не добавляем, тушим на сухой сковородке.\n\nИсточник: Книга рецептов · 3, стр. 43.", "y": null, "fresh": false, "auto": true}, "K3-044": {"name": "Курица в сметане", "group": "Основное", "lines": [["chicken", 500.0], ["c_сметана", 20], ["c_чеснок", 7.0]], "method": "Курицу мелко режем, маринуем в сметане с чесноком, добавляем специи. Все хорошо перемешиваем и тушим до готовности на сковороде. В течении 20 минут. Сверху можно посыпать порезанной зеленью.\n\nИсточник: Книга рецептов · 3, стр. 44. Часть граммов ориентировочная — поправьте, если в книге иначе. По вкусу: специи/соль.", "y": null, "fresh": false, "auto": true}, "K3-045": {"name": "Курица обжаренная на пергаменте", "group": "Основное", "lines": [["chicken", 200.0]], "method": "Куриное филе режем, натираем чесноком, солим, добавляем специи. и обжариваем на пергаменте с 2 сторон по 4 минуты.\n\nИсточник: Книга рецептов · 3, стр. 45. По вкусу: специи/соль.", "y": null, "fresh": false, "auto": true}, "K3-046": {"name": "Курица с ананасом", "group": "Основное", "lines": [["chicken", 250.0], ["c_йогурт", 150], ["c_чеснок", 5.0], ["c_ананас", 80.0], ["c_сыр", 20.0]], "method": "Филе нарезать поперек волокон, отбить и разложить на противень, застеленный пергаментом. Смешать натуральный йогурт, чеснок и намазать куриные отбивные. Сверху выложить кольца ананаса и посыпать небольшим количеством сыра. Запекать в духовке, при температуре 200 градусов, в течении 40 минут.\n\nИсточник: Книга рецептов · 3, стр. 46. Часть граммов ориентировочная — поправьте, если в книге иначе.", "y": null, "fresh": false, "auto": true}, "K3-047": {"name": "Курица в соусе Терияки", "group": "Основное", "lines": [["c_макароны", 100.0], ["chicken", 200.0], ["c_соус", 15.0], ["c_чеснок", 7.0], ["c_кунжут", 5.0]], "method": "Макароны отвариваем до готовности. Куриное филе обжариваем на сухой сковородке, добавляем соус и специи
