<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Семейное меню</title><style>*{box-sizing:border-box}body{max-width:800px;margin:auto;padding:22px;background:#f5f4ed;color:#203c30;font:16px/1.5 system-ui}header,section,details{padding:16px;background:white;margin:12px 0;border-radius:14px}h1,h2,p{margin:5px 0 9px}button,select{font:inherit;padding:8px;border:1px solid #b4c5b8;border-radius:8px;max-width:100%}button{background:#23573b;color:white;cursor:pointer}summary{cursor:pointer;font-weight:bold}small{color:#57655b}label{display:block;margin:8px 0}ul{padding-left:22px}</style><header><small>ДОМА · ПЛАН НА НЕДЕЛЮ</small><h1>Семейное меню</h1><label><input id="two" type="checkbox" checked> Муж участвует</label><button id="gen">Составить меню</button><p><small>Стартовая база. На человека запланировано по половине рецепта или одному фрукту. Это размер подачи в плане, а не выход из книги.</small></p></header><main id="out"></main><script>
const R=[['Омлет','завтрак','яйцо:2:шт|соль|специи','Взбить яйца и готовить под крышкой на слабом огне.'],['Овсяноблин','завтрак','овсяная мука:40:г|яйцо:1:шт|молоко:40:мл','Смешать ингредиенты и испечь блин на сковороде.'],['Бефстроганов','основное','говяжья вырезка:200:г|сметана 10%:100:г|лук:50:г|горчица:40:г|специи','Нарезать мясо и лук, обжарить, добавить сметану, горчицу и специи и тушить до готовности.'],['Бигус','основное','капуста:500:г|говяжья вырезка:400:г|лук:50:г|томатная паста:100:г|морковь:100:г|вода:100:мл|специи','Нарезать овощи и мясо. Тушить с томатной пастой и водой до готовности.'],['Запеканка из брокколи с форелью','основное','брокколи:400:г|форель:300:г|яйцо:3:шт|сливки:5:ст. л.|моцарелла:120:г|масло для формы','В смазанную форму положить рыбу и брокколи. Залить яйцами со сливками, посыпать сыром и запекать при 180 °C до готовности.'],...['Яблоко','Груша','Банан'].map(n=>[n,'перекус',n.toLowerCase()+':1:шт','Без приготовления.'])];const D=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'],M=['Завтрак','Перекус','Обед','Перекус','Ужин'],group=d=>d<2?0:d<5?1:2,T=['Воскресенье — на Пн и Вт','Вторник — на Ср, Чт и Пт','Суббота — на Сб и Вс'];let w=[];const n=()=>two.checked?2:1;function save(){try{localStorage.setItem('familyWeb1',JSON.stringify([w,two.checked]))}catch{}}function generate(){let rand=n=>Math.floor(Math.random()*n),a=rand(2),b=rand(3),c=rand(3);w=D.map((_,d)=>{let g=group(d);return [(a+g)%2,5+(d+c)%3,2+(b+g+d%2)%3,5+(d+c+1)%3,2+(b+g+1-d%2)%3]});save();render()}function change(d,j,i){w[d][j]=+i;save();render(d)}function render(open=0){if(!w.length){out.innerHTML='<section>Нажмите «Составить меню», чтобы увидеть блюда, заготовки и продукты на неделю.</section>';return}let bs=[{},{},{}],buy={};w.forEach((day,d)=>day.forEach(i=>{let r=R[i],recipe=r[1]!=='перекус',q=n()*(recipe?.5:1);if(recipe){let b=bs[group(d)];b[i]=(b[i]||0)+q}for(let l of r[2].split('|')){let [p,v,u]=l.split(':');buy[p]??=[0,u];if(v)buy[p][0]+=q*Number(v)}}));out.innerHTML='<h2>Меню недели</h2>'+w.map((day,d)=>`<details ${d===open?'open':''}><summary>${D[d]}</summary>${day.map((i,j)=>`<label>${M[j]} · <select onchange="change(${d},${j},this.value)">${R.map((r,k)=>r[1]===R[i][1]?`<option value="${k}" ${i===k?'selected':''}>${r[0]}</option>`:'').join('')}</select></label>`).join('')}</details>`).join('')+'<section><h2>Что приготовить</h2>'+bs.map((b,g)=>`<h3>${T[g]}</h3>`+Object.entries(b).map(([i,q])=>`<details><summary>${R[i][0]} · ${q*2} подач</summary>${R[i][3]}<ul>${R[i][2].split('|').map(l=>{let [p,v,u]=l.split(':');return `<li>${p}: ${v?q*v+' '+u:'по вкусу / уточнить'}</li>`}).join('')}</ul></details>`).join('')).join('')+'</section><section><h2>Список покупок</h2><small>Количество по рецептам, без пересчёта потерь. Отсутствующий вес не подставляется.</small><ul>'+Object.entries(buy).sort().map(([p,[v,u]])=>`<li>${p}: ${u?v+' '+u:'уточнить'}</li>`).join('')+'</ul></section>'}try{let [v,t]=JSON.parse(localStorage.familyWeb1);if(v.length===7&&v.every(d=>d.length===5&&d.every(i=>Number.isInteger(i)&&R[i]))){w=v;two.checked=t}}catch{}gen.onclick=generate;two.onchange=()=>{save();render()};render();</script></html>
