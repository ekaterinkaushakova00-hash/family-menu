function basis(k){return s.r[k]?(s.r[k].y||s.r[k].lines.reduce((a,l)=>a+l[1],0)):100}function unit(k){return s.r[k]&&!s.r[k].y?'г закладки':'г'}function macro(k,q){if(s.p[k])return s.p[k].n.map(v=>v===null?null:v*q/100);let r=s.r[k];return sum(r.lines.map(([p,g])=>macro(p,g*q/basis(k))))}function sum(v){return v.reduce((a,b)=>a.map((x,i)=>x===null||b[i]===null?null:x+b[i]),[0,0,0,0])}function label(v){return v.map((x,i)=>`${N[i]} ${x===null?'—':fmt(x)}`).join(' · ')}function mk(k,q){return {k,q:[q,q]}}function gen(){if(s.w.length&&!confirm('Заменить меню? Галочки участия мужа сохранятся.'))return;const prev=s.w;let n=s.n++;const pick=(g,i)=>{let ks=Object.keys(s.r).filter(k=>s.r[k].group===g);return ks.length?ks[i%ks.length]:null};s.w=days.map((_,di)=>{let b=block(di),i=b+n,br=pick('Завтрак',i),me=pick('Мясное',i),sa=pick('Салат',i),ga=pick('Гарнир',i);let rows=[[mk(br||'egg',br?basis(br):100),mk('banana',80),mk('soft',80),mk('latte',200)],[mk(['apple','pear'][di%2],150)],[mk(ga||'bread',ga?basis(ga)*.55:40),mk(me||'turkey',me?basis(me)*.3:125),mk(sa||'cucumber',sa?basis(sa)*.4:130),mk('bread',30)],[mk('yog',150)],[mk(me||'turkey',me?basis(me)*.3:125),mk(sa||'tomato',sa?basis(sa)*.5:150)]];return rows.map((rows,j)=>({h:prev[di]?.[j]?.h??true,rows}))});save();go(0)}
function totals(m,i){return sum(m.rows.map(l=>macro(l.k,l.q[i])))}function batch(){let bs=[{}, {}, {}],buy={};s.w.forEach((day,di)=>day.forEach(m=>m.rows.forEach(({k,q})=>{let g=q[0]+(m.h?q[1]:0);if(s.p[k]){buy[k]=(buy[k]||0)+g;return}let e=bs[block(di)][k]||={g:0,days:{},portions:0};e.g+=g;e.days[di]=(e.days[di]||0)+g;e.portions+=1+Number(m.h);for(let [p,qty] of s.r[k].lines)buy[p]=(buy[p]||0)+qty*g/basis(k)})));return {bs,buy}}
function go(i){tab=i;$('nav').innerHTML=tabs.map((t,j)=>`<button class="${i===j?'on':''}" onclick="go(${j})">${t}</button>`).join('');[menu,prep,shopping,products,recipes][i]()}function menu(){let w=s.w[d];$('app').innerHTML=`<button class="main" onclick="gen()">Составить меню</button>`+(!w?'<section>Составьте неделю, затем выберите день. Вы сможете менять блюда, вес и участие мужа отдельно для каждого приёма.</section>':`<section><div class="days">${short.map((n,i)=>`<button class="${i===d?'on':''}" onclick="d=${i};menu()">${n}</button>`).join('')}</div><h2>${days[d]}</h2><small>КБЖУ справочные. Прочерк — не хватает данных. «Г закладки» — масса ингредиентов до готовки, не вес готовой порции. Взвесьте выход один раз в рецепте, чтобы планировать по готовому весу.</small></section>`+w.map((m,j)=>`<article><h3>${meals[j]}</h3><label><input type="checkbox" ${m.h?'checked':''} onchange="s.w[d][${j}].h=this.checked;save();menu()"> Муж ест</label>${m.rows.map((l,t)=>`<div class="line"><label class="food">Блюдо или продукт<select onchange="row(${j},${t},'k',this)">${sel(all(),l.k)}</select></label><label>Я, ${unit(l.k)}<input aria-label="Моя порция" type="number" min="0.1" step="any" value="${fmt(l.q[0])}" onchange="row(${j},${t},0,this)"></label>${m.h?`<label>Муж, ${unit(l.k)}<input type="number" min="0.1" step="any" value="${fmt(l.q[1])}" onchange="row(${j},${t},1,this)"></label>`:''}${btn('Убрать',`s.w[d][${j}].rows.splice(${t},1);save();menu()`)} </div><small>Я: ${label(macro(l.k,l.q[0]))}</small>`).join('')}<p>${btn('+ Позиция',`s.w[d][${j}].rows.push(mk('apple',100));save();menu()`)}</p><b>Итого · я:</b> ${label(totals(m,0))}${m.h?`<br><b>Муж:</b> ${label(totals(m,1))}`:''}</article>`).join('')+`<section><h3>За день</h3>Я: ${label(sum(w.map(m=>totals(m,0))))}<br>Муж: ${label(sum(w.filter(m=>m.h).map(m=>totals(m,1))))}</section>`);}

function download(data,file){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function recipes(){ $('app').innerHTML='<h2>Рецепты</h2><p>Это редактируемые домашние варианты, не точная перепечатка книг. Стартовые количества и размеры подачи — настройки плана. В карточке блюда можно изменить состав, выход и способ приготовления.</p>'+btn('+ Рецепт',"editR('')")+'<section>'+Object.keys(s.r).map(k=>`<p>${btn(s.r[k].name,`editR('${k}')`)} · ${esc(s.r[k].group)}</p>`).join('')+'</section><details><summary>Резервная копия и помощь ИИ</summary><p>Ссылка на сайт не даёт ИИ доступа к вашим изменениям. Скачайте каталог и отправьте его помощнику с просьбой изменить состав рецепта, сохранив формат и идентификаторы. Затем загрузите полученный JSON. Профили и меню в каталог не входят.</p>'+btn('Скачать каталог для ИИ',"download({v:2,p:s.p,r:s.r},'catalog.json')")+btn('Сохранить полную копию',"download(s,'family-backup.json')")+'<label>Восстановить копию или импортировать каталог<input type="file" accept="application/json,.json" onchange="importFile(this)"></label></details>'}
