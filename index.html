nav button{flex:none;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:8px 15px;min-height:40px;font-size:15px}
nav button.on{background:var(--green);color:#fff}
button,select,input,textarea{font:inherit;color:inherit;max-width:100%;min-height:44px;border:1px solid #d7d9cf;background:#fff;border-radius:12px;padding:9px 12px}
button{cursor:pointer;background:var(--green2);border-color:transparent;color:var(--green);font-weight:600;transition:background .15s}

.main{background:var(--green);color:#fff;padding:12px 26px;border-radius:14px;font-size:16px;box-shadow:0 6px 16px -8px rgba(59,94,71,.7)}
.main:hover{background:#30503b}

summary{cursor:pointer;font-weight:650}
label{display:block;margin:6px 0;font-size:13px;color:var(--muted)}

input[type=checkbox]{min-height:auto;width:20px;height:20px;accent-color:var(--green);vertical-align:-4px;margin-right:6px}
ul{padding-left:20px;margin:8px 0}
li{margin:3px 0}
textarea{min-height:90px;width:100%}
.warn{color:#8a5a1e}
.crumb{display:block;font-size:13px;letter-spacing:.08em;color:var(--muted)}
.daytitle{font-size:clamp(32px,6vw,46px);font-weight:750;letter-spacing:-.02em;margin:4px 0 18px}
.daily{background:#fff;border-radius:24px;padding:clamp(16px,3.4vw,28px);border-color:#dcdcd2}
.daily h3{font-size:clamp(20px,3.6vw,26px);margin:0 0 14px}
.kb{width:100%;border-collapse:collapse;table-layout:fixed;text-align:center;font-variant-numeric:tabular-nums}
.kb th,.kb td{border:0;padding:6px 0}

.kb th:first-child{text-align:left;width:18%}
.kb tr:not(:first-child) th{font-size:clamp(17px,3.4vw,24px);font-weight:700}
.kb button{background:none;border:0;box-shadow:none;padding:2px 0;min-height:40px;font-size:clamp(18px,3.8vw,28px);font-weight:750;color:var(--text);width:100%}
.kb tr:last-child>*{border-top:1px solid #e7e8e2}
.kb .lo{color:var(--blue)}.kb .hi{color:var(--red)}
#hint{display:block;margin-top:10px;min-height:1em}
#hint:empty{display:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:20px 0 26px}
.days{display:flex;gap:3px;background:#ebe8de;padding:4px;border-radius:15px}
.days button{background:transparent;color:var(--muted);min-height:38px;padding:6px 11px;border-radius:11px;font-weight:600}
.days button.on{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.sectitle{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.sectitle h2{font-size:22px;margin:0}
article{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;padding-top:16px}
article>h3{margin:0;font-size:20px}
article>label:first-of-type{margin:0;background:var(--green2);color:var(--green);padding:6px 12px;border-radius:999px;font-weight:600;font-size:13.5px;cursor:pointer}
article>.line,article>p,article>small,article>b,article>br{grid-column:1/-1}
article>p{margin:12px 0 0}
article>p button{background:transparent;border:1.5px dashed #b8c7ba;width:100%}
.line{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(80px,1fr) minmax(80px,1fr) auto;gap:10px;align-items:end;border-top:1px solid #efece4;margin-top:12px;padding-top:12px}
.line label{margin:0}
.line>button{background:transparent;color:#9a6a58;font-weight:500;padding:9px 10px}
.line>button:hover{background:#f6ebe5}
section>p{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0;padding:10px 0;border-top:1px solid #efece4}
section>p:first-of-type{border-top:0}
section>p>button{background:transparent;padding:4px 0;min-height:36px;color:var(--text);text-align:left}
section>p>button:hover{background:none;text-decoration:underline}
section>h3{margin-bottom:8px}
@media(max-width:600px){nav::before{display:none}nav{flex-wrap:wrap;gap:4px;padding-top:10px}nav button{flex:1 1 auto;padding:7px 10px;font-size:14px;min-height:38px}.line{grid-template-columns:1fr 1fr auto}.food{grid-column:1/-1}.bar{flex-direction:column;align-items:stretch}.days button{flex:1;padding:6px 0}.main{width:100%}.kb th:first-child{width:15%}}
