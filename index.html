nav button{flex:none;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:8px 15px;min-height:40px;font-size:15px}
nav button.on{background:var(--green);color:#fff}
button,select,input,textarea{font:inherit;color:inherit;max-width:100%;min-height:44px;border:1px solid #d7d9cf;background:#fff;border-radius:12px;padding:9px 12px}
button{cursor:pointer;background:var(--green2);border-color:transparent;color:var(--green);font-weight:600;transition:background .15s}

.main{background:var(--green);color:#fff;padding:12px 26px;border-radius:14px;font-size:16px;box-shadow:0 6px 16px -8px rgba(59,94,71,.7)}
.main:hover{background:#30503b}

summary{cursor:pointer;font-weight:650}
label{display:block;margin:6px 0;font-size:13px;color:var(--muted)}

input[type=checkbox]{min-height:auto;width:20px;height:20px;accent-color:var(--green);vertical-align:-4px;margin-right:6px}
ul{padding-left:20px;margin:8px 0}
li{margin:3px 0}
textarea{min-height:90px;width:100%}
.warn{color:#8a5a1e}
.crumb{display:block;font-size:13px;letter-spacing:.08em;color:var(--muted)}
.daytitle{font-size:clamp(32px,6vw,46px);font-weight:750;letter-spacing:-.02em;margin:4px 0 18px}
.daily{background:#fff;border-radius:24px;padding:clamp(16px,3.4vw,28px);border-color:#dcdcd2}
.daily h3{font-size:clamp(20px,3.6vw,26px);margin:0 0 14px}
.kb{width:100%;border-collapse:collapse;table-layout:fixed;text-align:center;font-variant-numeric:tabular-nums}
.kb th,.kb td{border:0;padding:6px 0}

.kb th:first-child{text-align:left;width:18%}
.kb tr:not(:first-child) th{font-size:clamp(17px,3.4vw,24px);font-weight:700}
.kb button{background:none;border:0;box-shadow:none;padding:2px 0;min-height:40px;font-size:clamp(18px,3.8vw,28px);font-weight:750;color:var(--text);width:100%}
.kb tr:last-child>*{border-top:1px solid #e7e8e2}
.kb .lo{color:var(--blue)}.kb .hi{color:var(--red)}
#hint{display:block;margin-top:10px;min-height:1em}
#hint:empty{display:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:20px 0 26px}
.days{display:flex;gap:3px;background:#ebe8de;padding:4px;border-radius:15px}
.days button{background:transparent;color:var(--muted);min-height:38px;padding:6px 11px;border-radius:11px;font-weight:600}
.days button.on{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.sectitle{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.sectitle h2{font-size:22px;margin:0}
article{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;padding-top:16px}
article>h3{margin:0;font-size:20px}
article>label:first-of-type{margin:0;background:var(--green2);color:var(--green);padding:6px 12px;border-radius:999px;font-weight:600;font-size:13.5px;cursor:pointer}
article>.line,article>p,article>small,article>b,article>br{grid-column:1/-1}
article>p{margin:12px 0 0}
article>p button{background:transparent;border:1.5px dashed #b8c7ba;width:100%}
.line{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(80px,1fr) minmax(80px,1fr) auto;gap:10px;align-items:end;border-top:1px solid #efece4;margin-top:12px;padding-top:12px}
.line label{margin:0}
.line>button{background:transparent;color:#9a6a58;font-weight:500;padding:9px 10px}
.line>button:hover{background:#f6ebe5}
section>p{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0;padding:10px 0;border-top:1px solid #efece4}
section>p:first-of-type{border-top:0}
section>p>button{background:transparent;padding:4px 0;min-height:36px;color:var(--text);text-align:left}
section>p>button:hover{background:none;text-decoration:underline}
section>h3{margin-bottom:8px}
@media(max-width:600px){nav::before{display:none}nav{flex-wrap:wrap;gap:4px;padding-top:10px}nav button{flex:1 1 auto;padding:7px 10px;font-size:14px;min-height:38px}.line{grid-template-columns:1fr 1fr auto}.food{grid-column:1/-1}.bar{flex-direction:column;align-items:stretch}.days button{flex:1;padding:6px 0}.main{width:100%}.kb th:first-child{width:15%}}

function products(){ $('app').innerHTML='<h2>Продукты</h2><p>КБЖУ на 100 г. Базовые значения — USDA FoodData Central, SR Legacy. Для мягкого творога укажите данные с вашей упаковки: зернёный творог — другой продукт.</p>'+btn('+ Продукт',"editP('')")+'<section>'+Object.keys(s.p).map(k=>`<p>${btn(s.p[k].name,`editP('${k}')`)} <small>${label(s.p[k].n)}</small></p>`).join('')+'</section>'}
function editP(k){let p=s.p[k]||{name:'',n:[]};$('app').innerHTML='<h2>Продукт · на 100 г</h2>'+field('nm','Название',p.name,'text')+N.map((v,i)=>field('n'+i,v,p.n[i])).join('')+(p.fdc?`<p>Справочное значение: USDA FDC ${p.fdc}</p>`:'')+btn('Сохранить',`putP('${k}')`)+btn('Отмена','products()')}function putP(k){let name=get('nm'),n=N.map((_,i)=>num('n'+i));if(!name||n.some(x=>x!==null&&(!Number.isFinite(x)||x<0)))return alert('Проверьте название и числа');s.p[k||uid()]={name,n};save();products()}
function download(data,file){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function recipes(){ $('app').innerHTML='<h2>Рецепты</h2><p>Это редактируемые домашние варианты, не точная перепечатка книг. Стартовые количества и размеры подачи — настройки плана. В карточке блюда можно изменить состав, выход и способ приготовления.</p>'+btn('+ Рецепт',"editR('')")+'<section>'+Object.keys(s.r).map(k=>`<p>${btn(s.r[k].name,`editR('${k}')`)} · ${esc(s.r[k].group)}</p>`).join('')+'</section><details><summary>Резервная копия и помощь ИИ</summary><p>Ссылка на сайт не даёт ИИ доступа к вашим изменениям. Скачайте каталог и отправьте его помощнику с просьбой изменить состав рецепта, сохранив формат и идентификаторы. Затем загрузите полученный JSON. Профили и меню в каталог не входят.</p>'+btn('Скачать каталог для ИИ',"download({v:2,p:s.p,r:s.r},'catalog.json')")+btn('Сохранить полную копию',"download(s,'family-backup.json')")+'<label>Восстановить копию или импортировать каталог<input type="file" accept="application/json,.json" onchange="importFile(this)"></label></details>'}
let edit=[];function editR(k){let r=s.r[k]||{group:'Другое',lines:[['egg',50]]};edit=r.lines.map(x=>[...x]);$('app').innerHTML='<h2>Карточка рецепта</h2>'+field('nm','Название',r.name,'text')+'<label>Категория<select id="grp">'+groups.map(g=>`<option ${r.group===g?'selected':''}>${g}</option>`).join('')+'</select></label>'+field('yield','Вес всего готового блюда, г (оставьте пустым, если неизвестен)',r.y)+`<label><input id="fresh" type="checkbox" ${r.fresh?'checked':''}> Готовить или собирать в день подачи</label><label>Приготовление<textarea id="meth">${esc(r.method)}</textarea></label><h3>Продукты на весь рецепт</h3><div id="ing"></div>`+btn('+ Ингредиент',"edit.push(['egg',50]);ings()")+btn('Сохранить рецепт',`putR('${k}')`)+btn('Отмена','recipes()');ings()}
function ings(){$('ing').innerHTML=edit.map(([p,g],i)=>`<article><select onchange="edit[${i}][0]=this.value">${sel(Object.keys(s.p),p)}</select><label>Масса съедобной части, г<input type="number" step="any" value="${esc(g)}" oninput="edit[${i}][1]=Number(this.value)"></label>${btn('Убрать ингредиент',`edit.splice(${i},1);ings()`)}</article>`).join('')}
function putR(k){let name=get('nm'),y=num('yield');if(!name||!edit.length||edit.some(x=>!valid(x[1]))||(y!==null&&!valid(y)))return alert('Укажите название, продукты и положительный вес');let old=k?basis(k):null;let r={name,y,lines:edit,method:get('meth'),group:get('grp'),fresh:$('fresh').checked};s.r[k||uid()]=r;if(k&&old){let f=basis(k)/old;for(let day of s.w)for(let m of day)for(let l of m.rows)if(l.k===k)l.q=l.q.map(q=>q*f)}save();recipes()}
async function importFile(el){try{let f=el.files[0];if(!f||f.size>3000000)throw 0;let x=JSON.parse(await f.text()),safe=k=>/^[a-z][a-z0-9_-]*$/i.test(k)&&!(k in Object.prototype),has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k),arr=Array.isArray;if(x.v!==2||!x.p||!x.r)throw 0;for(let [k,p] of Object.entries(x.p))if(!safe(k)||typeof p.name!=='string'||!arr(p.n)||p.n.length!==4||!p.n.every(v=>v===null||Number.isFinite(v)&&v>=0))throw 0;for(let [k,r] of Object.entries(x.r))if(!safe(k)||has(x.p,k)||typeof r.name!=='string'||!groups.includes(r.group)||!arr(r.lines)||!r.lines.length||!r.lines.every(([p,g])=>safe(p)&&has(x.p,p)&&valid(g))||!(r.y===null||valid(r.y)))throw 0;let next={...s,p:{...s.p,...x.p},r:{...s.r,...x.r}};if(x.w!==undefined){if(!arr(x.w)||![0,7].includes(x.w.length)||!x.w.every(day=>arr(day)&&day.length===5&&day.every(m=>typeof m.h==='boolean'&&arr(m.rows)&&m.rows.every(l=>safe(l.k)&&(has(next.r,l.k)||has(next.p,l.k))&&arr(l.q)&&l.q.length===2&&l.q.every(valid)))))throw 0;next.w=x.w;next.n=Number.isInteger(x.n)&&x.n>=0?x.n:0}if(!confirm(x.w?'Восстановить меню и каталог из копии?':'Применить каталог? Совпадающие продукты и рецепты будут заменены.'))return;s=next;save();recipes()}catch{alert('Не удалось прочитать копию. Данные не изменены.')}}if(s.w.length)go(0);else gen();
</script></html>
